<style>
:root{--paper:#E6EAE3;--sheet:#F6F7F2;--ink:#1D2333;--sub:#5A6070;--line:#C8CEC3;--kon:#26335C;--roku:#2E7A6A;--kin:#8E6E28;--shu:#AE412B;--hi:#DCE5DF;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#12151C;--sheet:#1A1E27;--ink:#E5E6E1;--sub:#9BA1AD;--line:#2E3441;--kon:#93A6DB;--roku:#5DB6A2;--kin:#D0AE66;--shu:#E37D64;--hi:#222A33;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#12151C;--sheet:#1A1E27;--ink:#E5E6E1;--sub:#9BA1AD;--line:#2E3441;--kon:#93A6DB;--roku:#5DB6A2;--kin:#D0AE66;--shu:#E37D64;--hi:#222A33;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 "Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.mc{font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif}
#app{max-width:760px;margin:0 auto;min-height:100vh;background:var(--sheet);border-inline:1px solid var(--line)}
#hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--sheet);border-bottom:1px solid var(--line)}
#hd .hb{width:40px;height:40px;border:1px solid var(--line);background:none;border-radius:8px;font-size:20px;cursor:pointer;flex:none}
#hd .ttl{flex:1;min-width:0;font-family:"Shippori Mincho B1",serif;font-weight:700;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hd .ttl small{display:block;font-size:11px;font-weight:500;color:var(--sub);font-family:"Zen Kaku Gothic New",sans-serif;line-height:1.2}
.yrc{display:flex;align-items:center;border:1px solid var(--kon);border-radius:8px;overflow:hidden;flex:none}
.yrc button{background:none;border:0;height:38px;min-width:34px;cursor:pointer;color:var(--kon);font-size:17px}
.yrc .yv{font-family:"Shippori Mincho B1",serif;font-weight:700;font-size:16px;padding:0 8px;border-inline:1px solid var(--kon);min-width:74px}
#view{padding:0 0 calc(92px + env(safe-area-inset-bottom,0px))}
#tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:center;background:var(--sheet);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs .in{display:flex;width:100%;max-width:760px}
#tabs button{flex:1;background:none;border:0;padding:6px 0 7px;cursor:pointer;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:1px}
#tabs b{font-family:"Shippori Mincho B1",serif;font-size:21px;line-height:1.15;width:34px;height:30px;display:grid;place-items:center;border-radius:6px}
#tabs small{font-size:11px}
#tabs button[aria-current="true"]{color:var(--kon)}
#tabs button[aria-current="true"] b{background:var(--kon);color:var(--sheet)}
.tools{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
.tools input[type=search]{flex:1 1 200px;min-width:0}
input,select,textarea{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-height:40px;width:100%}
.tools select{width:auto;flex:0 1 auto}
textarea{min-height:80px;resize:vertical}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.chk input{width:auto;min-height:0}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);text-decoration:none;cursor:pointer;background:none;width:100%;text-align:left;border-left:0;border-right:0;border-top:0}
.row:active{background:var(--hi)}
.mon{flex:none;width:34px;height:34px;display:grid;place-items:center;border:1.5px solid var(--kon);color:var(--kon);border-radius:50%;font-family:"Shippori Mincho B1",serif;font-weight:700;font-size:16px}
.rm{flex:1;min-width:0;display:flex;flex-direction:column}
.nm{font-family:"Shippori Mincho B1",serif;font-weight:700;font-size:17px;line-height:1.35}
.nm small{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:400;font-size:12px;color:var(--sub);margin-left:8px}
.sub{font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{flex:none;font-size:12px;color:var(--sub);text-align:right}
.dead .nm{color:var(--sub)}
.grp{padding:14px 14px 4px;font-size:12px;color:var(--sub);border-bottom:1px solid var(--line)}
.fab{position:fixed;right:max(16px,calc(50vw - 364px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--kon);color:var(--sheet);border:0;border-radius:24px;padding:12px 20px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(20,30,60,.25)}
.empty{padding:36px 22px;text-align:center}
.empty h2{font-family:"Shippori Mincho B1",serif;font-size:24px;margin:0 0 8px}
.empty p{color:var(--sub);margin:0 auto 20px;max-width:30em}
.btn{border:1px solid var(--kon);background:none;color:var(--kon);border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:500}
.btn.pri{background:var(--kon);color:var(--sheet)}
.btn.dng{border-color:var(--shu);color:var(--shu)}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sec{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.sech{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sech h3{margin:0;flex:1;font-family:"Shippori Mincho B1",serif;font-size:16px;color:var(--kon)}
.mini{border:1px solid var(--line);background:none;border-radius:6px;padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--sub)}
.none{margin:2px 0;color:var(--sub);font-size:13px}
.kv{display:grid;grid-template-columns:5.5em 1fr;gap:2px 10px;font-size:14px}
.kv>span:nth-child(odd){color:var(--sub);font-size:13px}
.li{display:flex;align-items:baseline;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}
.li:last-child{border-bottom:0}
.li .yrs{flex:none;width:6.6em;color:var(--sub);font-size:12.5px;font-variant-numeric:tabular-nums}
.li .bd{flex:1;min-width:0}
.li .ed{flex:none;border:0;background:none;color:var(--sub);cursor:pointer;font-size:13px;padding:2px 6px}
.lk{color:var(--roku);text-decoration:none;font-weight:500;cursor:pointer}
.lk:hover{text-decoration:underline}
.chip{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 6px;margin-right:4px;color:var(--sub);vertical-align:1px}
.chip.rk{border-color:var(--kin);color:var(--kin)}
.chip.ko{border-color:var(--roku);color:var(--roku)}
.chip.ng{border-color:var(--shu);color:var(--shu)}
.note{white-space:pre-wrap;font-size:14px}
.ph{display:flex;gap:16px;padding:16px 14px;border-bottom:1px solid var(--line)}
.plate{writing-mode:vertical-rl;flex:none;align-self:flex-start;font-family:"Shippori Mincho B1",serif;font-weight:700;font-size:28px;letter-spacing:.12em;border:1px solid var(--ink);padding:14px 9px;background:var(--paper);min-height:9em;border-radius:2px;box-shadow:3px 3px 0 var(--line)}
.plate small{display:block;margin-right:6px;font-size:13px;font-weight:500;color:var(--sub);letter-spacing:.05em}
.phb{flex:1;min-width:0}
.phb .now{margin:2px 0 10px;font-size:14px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.seg{display:flex;margin:12px 14px;border:1px solid var(--kon);border-radius:8px;overflow:hidden}
.seg button{flex:1;background:none;border:0;padding:8px 4px;cursor:pointer;color:var(--kon);font-weight:500}
.seg button+button{border-left:1px solid var(--kon)}
.seg button[aria-pressed="true"]{background:var(--kon);color:var(--sheet)}
.orow{padding-left:calc(14px + var(--d,0) * 18px)}
.orow .rm{border-left:2px solid var(--line);padding-left:10px}
.hold{flex:none;text-align:right;font-size:12.5px;max-width:45%}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.eq{border-collapse:collapse;font-size:13px;min-width:100%}
table.eq th,table.eq td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
table.eq th{background:var(--paper);font-family:"Shippori Mincho B1",serif;white-space:nowrap}
table.eq td a{display:block;white-space:nowrap}
.treebox{overflow:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--paper);max-height:72vh}
.treebox svg{display:block}
.zm{display:flex;gap:6px;align-items:center;padding:8px 14px;flex-wrap:wrap}
.zm .mini{font-size:15px;padding:2px 12px}
svg .nodeg{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 14px;font-size:12px;color:var(--sub)}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:4px;margin-right:4px}
.yrg{display:flex;align-items:center;gap:8px;padding:10px 14px 4px;font-family:"Shippori Mincho B1",serif;font-weight:700;font-size:17px;border-top:1px solid var(--line)}
.yrg.cur{background:var(--hi)}
.yrg .mini{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:400}
.tl{display:flex;gap:10px;padding:4px 14px 6px 22px;font-size:14px}
.tl .k{flex:none;width:22px;height:22px;display:grid;place-items:center;font-size:12px;border-radius:4px;background:var(--paper);border:1px solid var(--line);font-family:"Shippori Mincho B1",serif}
.tl .k.d{color:var(--shu);border-color:var(--shu)}
.tl .k.o{color:var(--kin);border-color:var(--kin)}
.tl .k.e{color:var(--kon);border-color:var(--kon)}
.iss{padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
.iss .lv{font-size:12px;margin-right:6px}
.result{padding:12px 14px;font-size:15px}
.result b{font-family:"Shippori Mincho B1",serif;font-size:18px;color:var(--kon)}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:8px;font-size:14px}
.path .ar{color:var(--sub);font-size:12px;border:1px solid var(--line);border-radius:10px;padding:0 8px}
.ov{position:fixed;inset:0;z-index:50;background:rgba(15,20,35,.45);display:flex;align-items:flex-end;justify-content:center}
.ov[hidden]{display:none}
.pk{z-index:60}
.sheet{background:var(--sheet);width:100%;max-width:640px;max-height:90vh;max-height:90dvh;overflow:auto;border-radius:14px 14px 0 0;padding:0 16px calc(18px + env(safe-area-inset-bottom,0px))}
.shh{position:sticky;top:0;background:var(--sheet);display:flex;align-items:center;gap:8px;padding:14px 0 10px;border-bottom:1px solid var(--line);margin-bottom:10px;z-index:1}
.shh h2{margin:0;flex:1;font-family:"Shippori Mincho B1",serif;font-size:18px}
.shh button{border:0;background:none;color:var(--sub);cursor:pointer;padding:6px}
.fld{display:block;margin-bottom:10px}
.fld>span{display:block;font-size:12.5px;color:var(--sub);margin-bottom:3px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.pick{width:100%;text-align:left;min-height:40px;border:1px dashed var(--kon);background:none;border-radius:7px;padding:8px 10px;cursor:pointer;color:var(--kon)}
.pick[data-val=""]{color:var(--sub);border-color:var(--line)}
.multi{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.multi .mc2{border:1px solid var(--line);border-radius:14px;padding:2px 4px 2px 10px;font-size:13px;display:inline-flex;align-items:center;gap:2px}
.multi .mc2 button{border:0;background:none;cursor:pointer;color:var(--sub);padding:0 5px}
.err{color:var(--shu);font-size:13px;min-height:1em}
.sact{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.hint{font-size:12px;color:var(--sub);margin:-4px 0 10px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:8px 16px;border-radius:20px;font-size:13px;z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.menu .row{font-size:15px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 10px}
.radarw{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
.radarw svg{flex:none;width:250px;max-width:100%;height:auto}
.stl{flex:1;min-width:150px;font-size:14px}
.stl div{display:grid;grid-template-columns:3em 2.2em 1fr;align-items:center;gap:6px;padding:2px 0}
.stl b{font-variant-numeric:tabular-nums;text-align:right}
.stl i{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.stl i span{display:block;height:100%;background:var(--roku)}
.stl small{grid-column:1/-1;color:var(--sub);font-size:12px;margin-top:4px}
.av{flex:none;width:34px;height:34px;border-radius:50%;object-fit:cover;border:1.5px solid var(--kon);background:var(--paper)}
.portrait{display:block;width:100%;max-width:170px;aspect-ratio:3/4;object-fit:cover;border:1px solid var(--ink);box-shadow:3px 3px 0 var(--line);margin-bottom:10px;cursor:zoom-in;background:var(--paper)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.gal button{border:1px solid var(--line);padding:0;background:var(--paper);cursor:zoom-in;display:flex;flex-direction:column;text-align:left}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.gal small{font-size:11px;color:var(--sub);padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imgs{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.imgs .it{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:7px;padding:6px}
.imgs .it img{width:56px;height:56px;object-fit:cover;flex:none;border-radius:4px}
.imgs .it input{flex:1;min-width:0;min-height:34px;padding:5px 8px;font-size:13px}
.imgs .it .ib{display:flex;flex-direction:column;gap:4px}
.imgs .first{border-color:var(--kon)}
.lbx{display:block;width:100%;max-height:70vh;object-fit:contain;background:var(--paper)}
:focus-visible{outline:2px solid var(--roku);outline-offset:2px}
/* iPhone は 16px 未満の入力欄に触れると画面を拡大するため、入力欄はすべて 16px 以上にする */
input,select,textarea{font-size:16px!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="hd"></header>
  <main id="view"></main>
</div>
<nav id="tabs"><div class="in"></div></nav>
<div id="ov" class="ov" hidden><div class="sheet" role="dialog" aria-modal="true"><div class="shh"><h2 id="ovt"></h2><button data-act="close">閉じる</button></div><div id="ovb"></div></div></div>
<div id="pk" class="ov pk" hidden><div class="sheet" role="dialog" aria-modal="true"><div class="shh"><h2 id="pkt"></h2><button data-act="pkclose">閉じる</button></div><input id="pkq" type="search" placeholder="名前で探す"><div id="pkl" style="margin-top:8px"></div></div></div>
<div id="toast"></div>
<datalist id="reltypes"><option>主従</option><option>師弟</option><option>側近</option><option>後見</option><option>庇護</option><option>恩義</option><option>恋慕</option><option>盟友</option><option>友人</option><option>好敵手</option><option>政敵</option><option>敵対</option><option>乳兄弟</option><option>義兄弟</option></datalist>
<datalist id="mkinds"><option>正室</option><option>継室</option><option>側室</option><option>夫</option><option>婚約</option></datalist>
<script>
'use strict';
/* ================= 基本 ================= */
const ARR=['persons','clans','ranks','offices','places','factions','events','marriages','relations','appts','grants','heads'];
const KL={persons:'人物',clans:'家',ranks:'位階',offices:'役職',places:'地名',factions:'勢力',events:'出来事',marriages:'婚姻',relations:'人間関係',appts:'任官',grants:'叙位',heads:'当主'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const num=v=>v===''||v==null||isNaN(+v)?null:+v;
function emptyWorld(){return {meta:{name:'無名の国',yearLabel:'',baseYear:1,updatedAt:0,v:1},persons:[],clans:[],ranks:[],offices:[],places:[],factions:[],events:[],marriages:[],relations:[],appts:[],grants:[],heads:[]}}
function normalize(o){const w=emptyWorld();if(!o||typeof o!=='object')throw new Error('形式が違います');w.meta={...w.meta,...(o.meta||{})};let any=false;for(const k of ARR){if(Array.isArray(o[k])){any=true;w[k]=o[k].filter(x=>x&&x.id)}}if(!any)throw new Error('台帳データが見つかりません');return w}
let W=emptyWorld();let ver=0,_ix=null;
const S={sort:'',tab:'persons',stack:[],q:'',alive:false,clanF:'',kan:'offices',net:{blood:true,marriage:true,rel:true,office:false,alive:true,focus:null,hops:2,faction:''},netZ:1,treeZ:1,tl:{person:null,clan:''},conn:{a:null,b:null},lastKey:''};

/* ================= 保存（IndexedDB） ================= */
const LSKEY='kokushi-daichou-v1',DBN='kokushi-daichou',OS='kv';
const Store={idb:null,timer:null,status:'local',
 open(){return new Promise(res=>{try{if(!('indexedDB' in window))return res(null);const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore(OS);r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(e){res(null)}})},
 async load(){
  this.idb=await this.open();
  if(this.idb){const v=await new Promise(res=>{try{const q=this.idb.transaction(OS).objectStore(OS).get('world');q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)}catch(e){res(null)}});if(v){try{return normalize(v)}catch(e){}}}
  else this.status='ls';
  try{const s=localStorage.getItem(LSKEY);if(s)return normalize(JSON.parse(s))}catch(e){}
  return null;
 },
 save(){W.meta.updatedAt=Date.now();clearTimeout(this.timer);this.timer=setTimeout(()=>this.flush(),250)},
 flush(){clearTimeout(this.timer);
  if(this.idb){try{const tx=this.idb.transaction(OS,'readwrite');tx.objectStore(OS).put(W,'world');tx.oncomplete=()=>{this.status='local'};tx.onerror=tx.onabort=()=>{this.status=tx.error&&tx.error.name==='QuotaExceededError'?'full':'error';toast('保存できませんでした。書き出しで控えを取ってください')}}catch(e){this.status='error'}}
  else{try{localStorage.setItem(LSKEY,JSON.stringify(W))}catch(e){this.status='full';toast('保存容量が足りません。画像を減らすか書き出してください')}}
 }
};
addEventListener('pagehide',()=>Store.flush());
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')Store.flush()});
function commit(){ver++;Store.save();render()}

/* ================= 索引 ================= */
function I(){
 if(_ix&&_ix.v===ver)return _ix;const m={v:ver};
 for(const k of ARR)m[k]=new Map(W[k].map(x=>[x.id,x]));
 const push=(mp,k,v)=>{if(!k)return;if(!mp.has(k))mp.set(k,[]);mp.get(k).push(v)};
 for(const k of ['kids','akids','mar','rel','apP','apO','grP','grR','hdC','hdP','offKids','clanMem','facMem','placeKids','evP'])m[k]=new Map();
 for(const p of W.persons){push(m.kids,p.fatherId,p);if(p.motherId!==p.fatherId)push(m.kids,p.motherId,p);push(m.akids,p.adoptFatherId,p);if(p.adoptMotherId!==p.adoptFatherId)push(m.akids,p.adoptMotherId,p);push(m.clanMem,p.clanId,p);push(m.facMem,p.factionId,p)}
 for(const x of W.marriages){push(m.mar,x.a,x);push(m.mar,x.b,x)}
 for(const x of W.relations){push(m.rel,x.from,x);if(x.to!==x.from)push(m.rel,x.to,x)}
 for(const x of W.appts){push(m.apP,x.personId,x);push(m.apO,x.officeId,x)}
 const gs=[...W.grants].sort((a,b)=>(a.year??-1e9)-(b.year??-1e9));
 for(const x of gs){push(m.grP,x.personId,x);push(m.grR,x.rankId,x)}
 for(const x of W.heads){push(m.hdC,x.clanId,x);push(m.hdP,x.personId,x)}
 for(const o of W.offices)push(m.offKids,o.parentId&&m.offices.has(o.parentId)?o.parentId:'_r',o);
 for(const p of W.places)push(m.placeKids,p.parentId&&m.places.has(p.parentId)?p.parentId:'_r',p);
 for(const e of W.events)for(const pid of (e.participants||[]))push(m.evP,pid,e);
 const byB=(a,b)=>(a.born??1e9)-(b.born??1e9);for(const v of m.kids.values())v.sort(byB);for(const v of m.akids.values())v.sort(byB);
 m.ranksSorted=[...W.ranks].sort((a,b)=>(a.order??999)-(b.order??999));
 _ix=m;return m;
}
const imgSrc=im=>im?(im.data||''):'';
const pImg=p=>imgSrc((p&&p.images||[])[0]);
function resizeImage(file,max,q){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*sc));c.height=Math.max(1,Math.round(im.naturalHeight*sc));const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?res({blob:b,data:c.toDataURL('image/jpeg',q)}):rej(new Error('画像を変換できません')),'image/jpeg',q)};im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('画像として読めません'))};im.src=url})}
async function makeImage(file){const {data}=await resizeImage(file,800,.82);return {data}}
function dropAssets(){}
const STATS=[['tou','統率'],['bu','武勇'],['chi','知略'],['gai','外政'],['nai','内政'],['mi','魅力']];
const statOf=(p,k)=>{const v=p&&p.stats&&p.stats[k];return v==null||v===''||isNaN(+v)?null:+v};
const hasStats=p=>STATS.some(([k])=>statOf(p,k)!=null);
const statSum=p=>STATS.reduce((a,[k])=>a+(statOf(p,k)||0),0);
function radarSVG(p){
 const sz=250,c=sz/2,R0=78,pt=(i,r)=>{const a=-Math.PI/2+i*Math.PI/3;return [c+r*Math.cos(a),c+r*Math.sin(a)]};
 const poly=r=>STATS.map((_,i)=>pt(i,r).map(v=>v.toFixed(1)).join(',')).join(' ');
 let g='';for(const lv of [20,40,60,80,100])g+=`<polygon points="${poly(R0*lv/100)}" fill="${lv===100?'var(--paper)':'none'}" stroke="var(--line)" stroke-width="${lv===100?1.4:1}"/>`;
 STATS.forEach((_,i)=>{const [x,y]=pt(i,R0);g+=`<line x1="${c}" y1="${c}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)"/>`});
 const vals=STATS.map(([k])=>Math.max(0,Math.min(100,statOf(p,k)||0)));
 const dp=vals.map((v,i)=>pt(i,R0*v/100).map(n=>n.toFixed(1)).join(',')).join(' ');
 g+=`<polygon points="${dp}" fill="var(--roku)" fill-opacity=".28" stroke="var(--roku)" stroke-width="2" stroke-linejoin="round"/>`;
 vals.forEach((v,i)=>{const [x,y]=pt(i,R0*v/100);g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2" fill="var(--roku)"/>`});
 STATS.forEach(([k,l],i)=>{const [x,y]=pt(i,R0+24);const v=statOf(p,k);const anc=Math.abs(x-c)<4?'middle':x>c?'start':'end';const dx=anc==='start'?-6:anc==='end'?6:0;
  g+=`<text x="${(x+dx).toFixed(1)}" y="${(y-2).toFixed(1)}" text-anchor="${anc}" font-size="13" font-family="Shippori Mincho B1,serif" font-weight="700" fill="var(--ink)">${l}</text><text x="${(x+dx).toFixed(1)}" y="${(y+13).toFixed(1)}" text-anchor="${anc}" font-size="12" fill="${v==null?'var(--sub)':'var(--roku)'}" font-weight="700">${v??'—'}</text>`});
 return `<svg viewBox="0 0 ${sz} ${sz}" role="img" aria-label="${esc(pn(p))}の能力：${STATS.map(([k,l])=>l+(statOf(p,k)??'未設定')).join('、')}">${g}</svg>`;
}
function statPanel(p){
 if(!hasStats(p))return '';
 const others=W.persons.filter(hasStats);
 const rank=k=>{const v=statOf(p,k);if(v==null)return '';return 1+others.filter(o=>(statOf(o,k)??-1)>v).length};
 const list=STATS.map(([k,l])=>{const v=statOf(p,k);return `<div><span class="mc">${l}</span><b>${v??'—'}</b><i><span style="width:${v??0}%"></span></i></div>`}).join('');
 const n=STATS.filter(([k])=>statOf(p,k)!=null).length,sum=statSum(p);
 const best=STATS.filter(([k])=>statOf(p,k)!=null).sort((a,b)=>statOf(p,b[0])-statOf(p,a[0]))[0];
 return `<div class="radarw">${radarSVG(p)}<div class="stl">${list}<small>合計 ${sum}・平均 ${n?Math.round(sum/n):'—'}${best?`・最も秀でるのは${best[1]}（${others.length}名中${rank(best[0])}位）`:''}</small></div></div>`;
}
const yrs=y=>y==null?'?':`${W.meta.yearLabel||''}${y}年`;
const span=(a,b)=>`${a??'?'}–${b??''}`;
const inR=(f,t,y)=>(f==null||f<=y)&&(t==null||t>=y);
const pn=p=>p?(((p.sei||'')+(p.mei||''))||'（名不詳）'):'（不明）';
const aliveAt=(p,y)=>(p.born==null||p.born<=y)&&(p.died==null||p.died>=y);
function labelOf(k,id){const x=I()[k]?.get(id);if(!x)return '（不明）';if(k==='persons')return pn(x);return x.name||x.title||'（無題）'}
const TYPE={persons:'person',clans:'clan',ranks:'rank',offices:'office',places:'place',factions:'faction'};
const L=(k,id,t)=>id&&I()[k]?.has(id)?`<a href="#" class="lk" data-act="go" data-type="${TYPE[k]}" data-id="${esc(id)}">${esc(t??labelOf(k,id))}</a>`:'—';
const PL=id=>L('persons',id);
function offPath(o){const ix=I(),out=[];const seen=new Set();let c=o;while(c&&!seen.has(c.id)){seen.add(c.id);out.unshift(c.name);c=ix.offices.get(c.parentId)}return out.join(' › ')}
function placePath(p){const ix=I(),out=[];const seen=new Set();let c=p;while(c&&!seen.has(c.id)){seen.add(c.id);out.unshift(c.name);c=ix.places.get(c.parentId)}return out.join(' › ')}

/* ================= 官職・位階の計算 ================= */
function rankAt(pid,y){const gs=I().grP.get(pid)||[];let r=null;for(const g of gs)if(g.year==null||g.year<=y)r=g;return r?I().ranks.get(r.rankId)||null:null}
function apptsAt(pid,y){return (I().apP.get(pid)||[]).filter(a=>inR(a.from,a.to,y))}
function holdersAt(oid,y){return (I().apO.get(oid)||[]).filter(a=>inR(a.from,a.to,y))}
function kouShu(pid,o,y){const pr=rankAt(pid,y),orr=I().ranks.get(o.rankId);if(!pr||!orr||pr.order==null||orr.order==null)return '';if(+pr.order<+orr.order)return '行';if(+pr.order>+orr.order)return '守';return ''}
function offTitle(ap,y){const o=I().offices.get(ap.officeId);if(!o)return '?';const t=kouShu(ap.personId,o,y);return (t?t+' ':'')+(ap.mod||'')+o.name}
function bosses(oid,y){const ix=I();let o=ix.offices.get(oid);const seen=new Set();while(o&&o.parentId&&!seen.has(o.parentId)){seen.add(o.parentId);const par=ix.offices.get(o.parentId);if(!par)break;const h=holdersAt(par.id,y);if(h.length)return h;o=par}return []}
function underlings(oid,y,d=0){const out=[];for(const k of (I().offKids.get(oid)||[])){const h=holdersAt(k.id,y);if(h.length)out.push(...h);else if(d<4)out.push(...underlings(k.id,y,d+1))}return out}
function roleText(p,y){if(p.born!=null&&y<p.born)return '';if(p.died!=null&&y>p.died)return `${p.died}年没`;const r=rankAt(p.id,y);const os=apptsAt(p.id,y).map(a=>offTitle(a,y));return [r?.name,os.join('・')].filter(Boolean).join(' ')}
function statusText(p,y){if(p.born!=null&&y<p.born)return '未生';if(p.died!=null&&y>p.died)return '故人';if(p.born!=null)return `${y-p.born}歳`;return ''}

/* ================= 血縁・続柄 ================= */
function ancestors(id,adopt){const ix=I(),d=new Map([[id,0]]),q=[id];while(q.length){const c=q.shift();const p=ix.persons.get(c);if(!p)continue;const ps=[p.fatherId,p.motherId];if(adopt)ps.push(p.adoptFatherId,p.adoptMotherId);for(const x of ps)if(x&&!d.has(x)&&d.get(c)<40){d.set(x,d.get(c)+1);q.push(x)}}return d}
function bloodRel(a,b,adopt){if(a===b)return {a:0,b:0,common:a};const A=ancestors(a,adopt),B=ancestors(b,adopt);let best=null;for(const [id,da] of A){if(B.has(id)){const db=B.get(id);if(!best||da+db<best.a+best.b)best={a:da,b:db,common:id}}}return best}
const older=(Q,P)=>Q.born!=null&&P.born!=null&&Q.born!==P.born?Q.born<P.born:null;
function termFor(r,P,Q){
 const ix=I(),s=Q.sex,g=(m,f,n)=>s==='m'?m:s==='f'?f:n;const {a,b}=r;
 if(a===0&&b===0)return '本人';
 if(a===0)return [null,g('息子','娘','子'),'孫','曾孫','玄孫','来孫'][b]||`${b}代後の子孫`;
 if(b===0)return [null,g('父','母','親'),g('祖父','祖母','祖父母'),g('曾祖父','曾祖母','曾祖父母'),g('高祖父','高祖母','高祖父母')][a]||`${a}代前の祖先`;
 const o=older(Q,P);
 if(a===1&&b===1){let pre='';const sf=P.fatherId&&P.fatherId===Q.fatherId,sm=P.motherId&&P.motherId===Q.motherId;if(sf&&!sm&&P.motherId&&Q.motherId)pre='異母';else if(sm&&!sf&&P.fatherId&&Q.fatherId)pre='異父';
  return pre+(o===null?g('兄弟','姉妹','きょうだい'):o?g('兄','姉','兄姉'):g('弟','妹','弟妹'))}
 if(a===2&&b===1){let par=null;for(const x of [P.fatherId,P.motherId]){if(x&&ancestors(x,false).get(r.common)===1){par=ix.persons.get(x);break}}const ob=par?older(Q,par):null;
  return ob===null?g('おじ','おば','おじ・おば'):ob?g('伯父','伯母','伯父母'):g('叔父','叔母','叔父母')}
 if(a===1&&b===2)return g('甥','姪','甥姪');
 if(a===2&&b===2)return o===null?g('従兄弟','従姉妹','いとこ'):o?g('従兄','従姉','いとこ'):g('従弟','従妹','いとこ');
 if(a===3&&b===1)return g('大叔父','大叔母','大おじ・大おば');
 if(a===1&&b===3)return g('又甥','又姪','又甥姪');
 if(a===3&&b===2)return g('従叔父','従叔母','いとこおじ・おば');
 if(a===2&&b===3)return g('従甥','従姪','いとこの子');
 if(a===3&&b===3)return 'はとこ（再従兄弟）';
 return `傍系${a+b}親等の血族`;
}
function spousesOf(id){return (I().mar.get(id)||[]).map(m=>({m,id:m.a===id?m.b:m.a}))}
function affinal(aId,bId){
 const ix=I(),A=ix.persons.get(aId),B=ix.persons.get(bId);
 for(const {m,id} of spousesOf(aId))if(id===bId)return `配偶者（${esc(m.kind||'婚姻')}）`;
 for(const {id} of spousesOf(aId)){const r=bloodRel(id,bId,false);if(r&&r.a+r.b<=4){const Sp=ix.persons.get(id);if(!Sp)continue;const t=termFor(r,Sp,B);let sp='';if(r.a===1&&r.b===0)sp=B.sex==='f'?'姑':'舅';else if(r.a===1&&r.b===1)sp='義理のきょうだい';return `配偶者 ${PL(id)} の${t}${sp?`（${sp}）`:''}`}}
 for(const {id} of spousesOf(bId)){if(id===aId)continue;const r=bloodRel(aId,id,false);if(r&&r.a+r.b<=4){const Sp=ix.persons.get(id);if(!Sp)continue;const t=termFor(r,A,Sp);let sp='';if(r.a===0&&r.b===1)sp=B.sex==='f'?'嫁':'婿';else if(r.a===1&&r.b===1)sp='義理のきょうだい';return `${t} ${PL(id)} の配偶者${sp?`（${sp}）`:''}`}}
 return null;
}
const RT={'主従':['主君','臣下'],'師弟':['師','弟子'],'側近':['主','側近'],'後見':['後見人','被後見人'],'庇護':['庇護者','被庇護者'],'恩義':['恩人','恩を受けた者'],'恋慕':['慕う者','想い人']};
const MUTUAL=new Set(['盟友','友人','好敵手','政敵','敵対','乳兄弟','義兄弟']);
const HOSTILE=new Set(['政敵','敵対','好敵手']);
function relRole(r,viewer){const ro=RT[r.type];if(ro)return r.from===viewer?ro[1]:ro[0];if(MUTUAL.has(r.type))return r.type;return r.from===viewer?`${r.type}の相手`:`${r.type}（相手から）`}
function adjacency(y){
 const ix=I(),adj=new Map();const add=(a,b,l)=>{if(!a||!b||a===b||!ix.persons.has(a)||!ix.persons.has(b))return;if(!adj.has(a))adj.set(a,[]);adj.get(a).push([b,l])};
 for(const p of W.persons){const fl=[['fatherId','父'],['motherId','母'],['adoptFatherId','養父'],['adoptMotherId','養母']];for(const [k,l] of fl)if(p[k]){add(p.id,p[k],l);add(p[k],p.id,k.startsWith('adopt')?'養子':'子')}}
 for(const m of W.marriages){add(m.a,m.b,'配偶者');add(m.b,m.a,'配偶者')}
 for(const r of W.relations){add(r.from,r.to,relRole(r,r.from));add(r.to,r.from,relRole(r,r.to))}
 for(const ap of W.appts){if(!inR(ap.from,ap.to,y))continue;for(const b of bosses(ap.officeId,y)){add(ap.personId,b.personId,'上官');add(b.personId,ap.personId,'部下')}for(const c of holdersAt(ap.officeId,y))add(ap.personId,c.personId,'同僚')}
 return adj;
}
function connPath(a,b,y){const adj=adjacency(y),prev=new Map([[a,null]]),q=[a];while(q.length){const c=q.shift();if(c===b)break;for(const [n,l] of (adj.get(c)||[]))if(!prev.has(n)){prev.set(n,[c,l]);q.push(n)}}if(!prev.has(b))return null;const out=[];let c=b;while(c!==a){const [p,l]=prev.get(c);out.unshift([c,l]);c=p}return out}
function kinReport(aId,bId){
 const ix=I(),A=ix.persons.get(aId),B=ix.persons.get(bId),y=W.meta.baseYear;if(!A||!B)return '';
 const out=[];
 const r=bloodRel(aId,bId,false);
 if(r)out.push(`<p>${PL(bId)} は ${PL(aId)} の <b>${esc(termFor(r,A,B))}</b><br><span class="sub">血族 ${r.a+r.b}親等・共通の祖：${PL(r.common)}</span></p>`);
 else{const r2=bloodRel(aId,bId,true);if(r2)out.push(`<p>${PL(bId)} は ${PL(aId)} の <b>${esc(termFor(r2,A,B))}</b>（養子縁組を通じて）<br><span class="sub">法定 ${r2.a+r2.b}親等・共通の祖：${PL(r2.common)}</span></p>`)}
 const af=affinal(aId,bId);if(af)out.push(`<p>姻族：${af}</p>`);
 if(!out.length)out.push('<p class="none">血縁・姻族の関係は見つかりません。</p>');
 const rs=(ix.rel.get(aId)||[]).filter(x=>x.from===bId||x.to===bId);
 if(rs.length)out.push(`<p>人間関係：${rs.map(x=>`<span class="chip ${HOSTILE.has(x.type)?'ng':'ko'}">${esc(x.type)}</span>${PL(bId)} は ${esc(relRole(x,aId))}`).join('、')}</p>`);
 const sh=[];if(A.clanId&&A.clanId===B.clanId)sh.push(`同じ${L('clans',A.clanId)}`);if(A.factionId&&A.factionId===B.factionId)sh.push(`同じ${L('factions',A.factionId)}`);
 for(const ap of apptsAt(aId,y)){if(bosses(ap.officeId,y).some(h=>h.personId===bId))sh.push(`${yrs(y)}に ${PL(bId)} が上官`);if(holdersAt(ap.officeId,y).some(h=>h.personId===bId&&h.personId!==aId))sh.push(`${yrs(y)}に同僚（${esc(labelOf('offices',ap.officeId))}）`);if(underlings(ap.officeId,y).some(h=>h.personId===bId))sh.push(`${yrs(y)}に ${PL(bId)} が部下`)}
 if(sh.length)out.push(`<p>共通点：${sh.join('、')}</p>`);
 const path=connPath(aId,bId,y);
 if(path&&path.length)out.push(`<div class="sub">最短のつながり（${path.length}段、${yrs(y)}時点の官職を含む）</div><div class="path">${PL(aId)}${path.map(([id,l])=>`<span class="ar">${esc(l)}</span>${PL(id)}`).join('')}</div>`);
 else out.push('<p class="none">記録上のつながりはありません。</p>');
 return `<div class="result">${out.join('')}</div>`;
}

/* ================= 家系図 ================= */
function buildForest(roots,opt){
 const ix=I(),seen=new Set();
 const mk=(p,adopt,d)=>{seen.add(p.id);const n={p,adopt,kids:[]};const expand=!opt.clanId||p.clanId===opt.clanId||d===0;
  if(expand&&d<(opt.max||8)){const ks=[...(ix.kids.get(p.id)||[]).map(c=>[c,false]),...(ix.akids.get(p.id)||[]).map(c=>[c,true])].sort((a,b)=>(a[0].born??1e9)-(b[0].born??1e9));for(const [c,ad] of ks)if(!seen.has(c.id))n.kids.push(mk(c,ad,d+1))}return n};
 const out=[];for(const r of roots)if(!seen.has(r.id))out.push(mk(r,false,0));return out;
}
function treeSVG(forest,focus){
 const anyImg=(f=>{const chk=n=>pImg(n.p)||n.kids.some(chk);return f.some(chk)})(forest);
 const U=66,LH=anyImg?220:186,RW=36,RH=anyImg?162:128,y0=14,base=W.meta.baseYear,top=anyImg?36:0;
 const meas=n=>{n.w=n.kids.length?n.kids.reduce((s,k)=>s+meas(k),0):1;return n.w};
 let maxD=0;const place=(n,x0,d)=>{n.d=d;maxD=Math.max(maxD,d);if(!n.kids.length)n.x=x0+.5;else{let x=x0;for(const k of n.kids){place(k,x,d+1);x+=k.w}n.x=(n.kids[0].x+n.kids[n.kids.length-1].x)/2}};
 let tot=0;for(const r of forest){meas(r);place(r,tot,0);tot+=r.w}
 const Wd=Math.max(tot*U+20,200),H=(maxD+1)*LH+y0;
 let edges='',nodes='';const cx=n=>10+n.x*U-6,cy=n=>y0+n.d*LH;
 const walk=n=>{const x=cx(n),y=cy(n),p=n.p;
  for(const k of n.kids){const kx=cx(k),ky=cy(k),my=y+RH+(LH-RH)/2;edges+=`<path d="M${x} ${y+RH}V${my}H${kx}V${ky}" fill="none" stroke="var(--kon)" stroke-width="1.3"${k.adopt?' stroke-dasharray="4 3"':''}/>`;walk(k)}
  const ch=[...pn(p)],fs=ch.length<=5?15:ch.length<=7?12:10;const alive=aliveAt(p,base),unborn=p.born!=null&&base<p.born;
  let t='';const av=pImg(p);if(av)t+=`<image href="${esc(av)}" x="${x-15}" y="${y+4}" width="30" height="30" preserveAspectRatio="xMidYMid slice" clip-path="url(#ccl)"/>`;
  ch.forEach((c,i)=>{t+=`<text x="${x}" y="${y+top+10+fs+i*(fs+2)}" text-anchor="middle" font-size="${fs}" font-family="Shippori Mincho B1,serif" font-weight="700" fill="var(--ink)">${esc(c)}</text>`});
  t+=`<text x="${x}" y="${y+RH-16}" text-anchor="middle" font-size="8.5" fill="var(--sub)">${p.born??'?'}</text><text x="${x}" y="${y+RH-5}" text-anchor="middle" font-size="8.5" fill="var(--sub)">${p.died??'〜'}</text>`;
  const sp=spousesOf(p.id);if(sp.length){const nm=[...('＝'+labelOf('persons',sp[0].id))].slice(0,8);nm.forEach((c,i)=>{t+=`<text x="${x+RW/2+9}" y="${y+14+i*12}" text-anchor="middle" font-size="10" fill="var(--kin)" font-family="Shippori Mincho B1,serif">${esc(c)}</text>`});if(sp.length>1)t+=`<text x="${x+RW/2+9}" y="${y+18+nm.length*12}" text-anchor="middle" font-size="9" fill="var(--kin)">+${sp.length-1}</text>`}
  const isF=p.id===focus;
  nodes+=`<g class="nodeg" data-act="go" data-type="person" data-id="${esc(p.id)}" opacity="${alive?1:.62}"><rect x="${x-RW/2}" y="${y}" width="${RW}" height="${RH}" rx="2" fill="var(--sheet)" stroke="${isF?'var(--roku)':p.sex==='f'?'var(--shu)':'var(--kon)'}" stroke-width="${isF?3:1.2}"${unborn?' stroke-dasharray="3 3"':''}/>${t}</g>`};
 forest.forEach(walk);
 return {svg:`<svg viewBox="0 0 ${Wd} ${H}" width="${Wd*S.treeZ}" height="${H*S.treeZ}" role="img" aria-label="家系図"><defs><clipPath id="ccl" clipPathUnits="objectBoundingBox"><circle cx=".5" cy=".5" r=".5"/></clipPath></defs>${edges}${nodes}</svg>`,n:forest.length};
}
const treeLegend=`<div class="legend"><span><i style="border-color:var(--kon)"></i>実子</span><span><i style="border-color:var(--kon);border-top-style:dashed"></i>養子</span><span>枠の色：<b style="color:var(--kon)">男</b>・<b style="color:var(--shu)">女</b></span><span style="color:var(--kin)">＝ 配偶者</span><span>薄い枠：基準年に故人</span></div>`;
const zoomBar=k=>`<div class="zm"><span class="sub">拡大</span><button class="mini" data-act="zoom" data-k="${k}" data-d="-1">−</button><button class="mini" data-act="zoom" data-k="${k}" data-d="1">＋</button></div>`;
function pageTree(id){
 const ix=I(),p=ix.persons.get(id);if(!p)return {t:'家系図',b:''};
 let top=p,seen=new Set();while(!seen.has(top.id)){seen.add(top.id);const n=ix.persons.get(top.fatherId)||ix.persons.get(top.motherId);if(!n)break;top=n}
 const {svg}=treeSVG(buildForest([top],{max:10}),id);
 return {t:`${pn(p)}の家系`,s:`始祖 ${pn(top)} からの子孫`,b:zoomBar('treeZ')+`<div class="treebox">${svg}</div>`+treeLegend};
}
function pageClans(){

 if(o.blood)for(const p of W.persons){for(const x of [p.fatherId,p.motherId])if(x)add(x,p.id,'blood');for(const x of [p.adoptFatherId,p.adoptMotherId])if(x)add(x,p.id,'adopt')}

 if(o.rel)for(const r of W.relations)add(r.from,r.to,HOSTILE.has(r.type)?'hos':'rel',r.type);
 if(o.office)for(const ap of W.appts)if(inR(ap.from,ap.to,y))for(const b of bosses(ap.officeId,y))add(b.personId,ap.personId,'off');
 let ids=cs;
 if(o.focus&&cs.has(o.focus)){const adj=new Map();for(const e of E){if(!adj.has(e.s))adj.set(e.s,[]);if(!adj.has(e.t))adj.set(e.t,[]);adj.get(e.s).push(e.t);adj.get(e.t).push(e.s)}const d=new Map([[o.focus,0]]),q=[o.focus];while(q.length){const c=q.shift();if(d.get(c)>=o.hops)continue;for(const n of (adj.get(c)||[]))if(!d.has(n)){d.set(n,d.get(c)+1);q.push(n)}}ids=new Set(d.keys())}

 if(!nodes.length)return ctrl+'<p class="none" style="padding:16px 14px">表示できる人物がいません。条件を変えてください。</p>';

 const leg=`<div class="legend"><span><i style="border-color:var(--kon)"></i>親子</span><span><i style="border-color:var(--kin);border-top-width:3px"></i>婚姻</span><span><i style="border-color:var(--roku)"></i>人間関係</span><span><i style="border-color:var(--shu)"></i>敵対・政敵</span><span><i style="border-color:var(--sub);border-top-style:dashed"></i>上官→部下</span><span>丸の色：勢力</span></div>`;
 return ctrl+zoomBar('netZ')+`<div class="treebox"><svg viewBox="0 0 600 600" style="width:${Math.round(100*S.netZ)}%;height:auto;max-width:none"><defs><clipPath id="ccl" clipPathUnits="objectBoundingBox"><circle cx=".5" cy=".5" r=".5"/></clipPath></defs>${es}${vs}</svg></div>`+leg+`<div class="grp">${nodes.length}名・${edges.length}本の線</div>`;

function forceLayout(nodes,edges){
 const n=nodes.length,idx=new Map(nodes.map((d,i)=>[d.id,i]));const k=Math.sqrt(36e4/Math.max(n,1))*.55;
 nodes.forEach((d,i)=>{const a=i/n*2*Math.PI,r=170+(i%7)*11;d.x=300+r*Math.cos(a);d.y=300+r*Math.sin(a)});
 const X=new Float64Array(n),Y=new Float64Array(n);nodes.forEach((d,i)=>{X[i]=d.x;Y[i]=d.y});
 const es=edges.map(e=>[idx.get(e.s),idx.get(e.t)]);let t=36;const it=n>120?160:300;
 for(let s=0;s<it;s++){const dx=new Float64Array(n),dy=new Float64Array(n);
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){let vx=X[i]-X[j],vy=Y[i]-Y[j];let d=Math.sqrt(vx*vx+vy*vy)||.1;const f=k*k/d;vx/=d;vy/=d;dx[i]+=vx*f;dy[i]+=vy*f;dx[j]-=vx*f;dy[j]-=vy*f}
  for(const [a,b] of es){let vx=X[a]-X[b],vy=Y[a]-Y[b];let d=Math.sqrt(vx*vx+vy*vy)||.1;const f=d*d/k;vx/=d;vy/=d;dx[a]-=vx*f;dy[a]-=vy*f;dx[b]+=vx*f;dy[b]+=vy*f}
  for(let i=0;i<n;i++){dx[i]+=(300-X[i])*.07*k/10;dy[i]+=(300-Y[i])*.07*k/10;const d=Math.sqrt(dx[i]*dx[i]+dy[i]*dy[i])||1;const m=Math.min(d,t);X[i]+=dx[i]/d*m;Y[i]+=dy[i]/d*m}
  t=Math.max(t*.985,1.5)}
 let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;for(let i=0;i<n;i++){x0=Math.min(x0,X[i]);x1=Math.max(x1,X[i]);y0=Math.min(y0,Y[i]);y1=Math.max(y1,Y[i])}
 const sc=Math.min(500/Math.max(x1-x0,1),500/Math.max(y1-y0,1),3);
 nodes.forEach((d,i)=>{d.x=300+(X[i]-(x0+x1)/2)*sc;d.y=292+(Y[i]-(y0+y1)/2)*sc});
}

function checks(){
 const ix=I(),out=[];const P=PL;const pushI=(lv,h)=>out.push({lv,h});
 for(const p of W.persons){
  if(p.born!=null&&p.died!=null&&p.died<p.born)pushI(2,`${P(p.id)}：没年が生年より前`);
  for(const [k,l] of [['fatherId','父'],['motherId','母']]){const par=ix.persons.get(p[k]);if(!par)continue;
   if(par.born!=null&&p.born!=null&&p.born-par.born<12)pushI(2,`${P(p.id)}：${l} ${P(par.id)} との年齢差が${p.born-par.born}年`);
   if(par.died!=null&&p.born!=null&&p.born>par.died+(k==='fatherId'?1:0))pushI(2,`${P(p.id)}：${l} ${P(par.id)} の没後に誕生`);
   if(k==='fatherId'&&par.sex==='f')pushI(1,`${P(p.id)}：父に女性が設定されている`);if(k==='motherId'&&par.sex==='m')pushI(1,`${P(p.id)}：母に男性が設定されている`)}
  const anc=ancestors(p.fatherId||p.motherId||'',true);if((p.fatherId||p.motherId)&&anc.has(p.id))pushI(2,`${P(p.id)}：自分が自分の祖先になっている（親子関係が循環）`);
 }
 const life=(pid,y,what)=>{const p=ix.persons.get(pid);if(!p||y==null)return;if(p.born!=null&&y<p.born)pushI(2,`${P(pid)}：生まれる前に${what}（${y}年）`);else if(p.died!=null&&y>p.died)pushI(2,`${P(pid)}：没後に${what}（${y}年）`);else if(p.born!=null&&y-p.born<8)pushI(1,`${P(pid)}：${y-p.born}歳で${what}`)};
 for(const a of W.appts){life(a.personId,a.from,`${labelOf('offices',a.officeId)}に就任`);if(a.from!=null&&a.to!=null&&a.to<a.from)pushI(2,`${P(a.personId)}：${esc(labelOf('offices',a.officeId))}の退任年が就任年より前`)}
 for(const g of W.grants)life(g.personId,g.year,`${labelOf('ranks',g.rankId)}に叙位`);
 for(const h of W.heads)life(h.personId,h.from,`${labelOf('clans',h.clanId)}の当主に`);
 for(const m of W.marriages){life(m.a,m.from,'婚姻');life(m.b,m.from,'婚姻');const r=bloodRel(m.a,m.b,false);if(r&&r.a+r.b<=3)pushI(1,`${P(m.a)} と ${P(m.b)}：${r.a+r.b}親等の近親婚`)}
 for(const o of W.offices){if(!(o.cap>0))continue;const aps=ix.apO.get(o.id)||[];const pts=new Set(aps.map(a=>a.from).filter(v=>v!=null));if(aps.some(a=>a.from==null))pts.add(-1e9);const bad=[];for(const y of [...pts].sort((a,b)=>a-b)){const c=aps.filter(a=>inR(a.from,a.to,y)&&!(a.to===y&&a.from!==y)).length;if(c>o.cap)bad.push(y<-1e8?'当初':y+'年')}if(bad.length)pushI(1,`${L('offices',o.id)}：定員${o.cap}を超える在任（${bad.slice(0,5).join('、')}${bad.length>5?'ほか':''}）`)}
 for(const c of W.clans){const hs=[...(ix.hdC.get(c.id)||[])].sort((a,b)=>(a.from??-1e9)-(b.from??-1e9));for(let i=1;i<hs.length;i++){const p=hs[i-1],q=hs[i];if(p.to==null||(q.from!=null&&q.from<p.to))pushI(1,`${L('clans',c.id)}：当主 ${P(p.personId)} と ${P(q.personId)} の在位が重なる`)}}
 for(const o of W.offices){let c=o,seen=new Set();while(c&&c.parentId){if(seen.has(c.id)){pushI(2,`${L('offices',o.id)}：上位官司が循環`);break}seen.add(c.id);c=ix.offices.get(c.parentId)}}
 return out.sort((a,b)=>b.lv-a.lv);
}

function collect(form){const o={};
 form.querySelectorAll('[name]').forEach(el=>{o[el.name]=el.dataset.num?num(el.value):el.value.trim()});
 form.querySelectorAll('.pick[data-field]').forEach(el=>{o[el.dataset.field]=el.dataset.val||null});

function openEdit(kind,id,preset){
 const isNew=!id;const ex=isNew?null:I()[kind].get(id);if(!isNew&&!ex)return;
 const cur=isNew?{id:uid(),...(preset||{})}:{...ex};
 openSheet((isNew?'新しい':'')+KL[kind]+(isNew?'':'の編集'),ED[kind](cur),data=>{
  const o={...cur,...data};
  if(kind==='persons'){const st={};for(const [k,l] of STATS){let v=o['st_'+k];delete o['st_'+k];if(v==null)continue;if(v<1||v>100)return `${l}は1〜100で入れてください`;st[k]=Math.round(v)}o.stats=st}
  const e=VAL[kind]&&VAL[kind](o);if(e)return e;
  if(kind==='persons'&&ex){const keep=new Set((o.images||[]).map(i=>i.id).filter(Boolean));dropAssets((ex.images||[]).filter(i=>i.id&&!keep.has(i.id)))}
  if(isNew)W[kind].push(o);else W[kind]=W[kind].map(x=>x.id===id?o:x);
  if(kind==='persons'&&isNew){commit();S.stack.push({type:'person',id:o.id});render()}else commit();
  toast(isNew?'加えました':'保存しました');
 },isNew?null:()=>{askConfirm(`この${KL[kind]}を削除しますか。関連する記録（婚姻・任官・叙位など）も外れます。`,'削除する',()=>{removeEntity(kind,id);const r=route();if(r&&r.id===id)S.stack.pop();commit();toast('削除しました')})});
}
function removeEntity(kind,id){
 if(kind==='persons')dropAssets((I().persons.get(id)||{}).images);
 W[kind]=W[kind].filter(x=>x.id!==id);
 const clr=(arr,f)=>{for(const x of W[arr])if(x[f]===id)x[f]=null};
 if(kind==='persons'){for(const f of ['fatherId','motherId','adoptFatherId','adoptMotherId'])clr('persons',f);W.marriages=W.marriages.filter(m=>m.a!==id&&m.b!==id);W.relations=W.relations.filter(r=>r.from!==id&&r.to!==id);W.appts=W.appts.filter(a=>a.personId!==id);W.grants=W.grants.filter(g=>g.personId!==id);W.heads=W.heads.filter(h=>h.personId!==id);for(const e of W.events)e.participants=(e.participants||[]).filter(x=>x!==id);clr('factions','leaderId');if(S.net.focus===id)S.net.focus=null;if(S.tl.person===id)S.tl.person=null}
 if(kind==='clans'){clr('persons','clanId');clr('clans','parentId');W.heads=W.heads.filter(h=>h.clanId!==id)}
 if(kind==='ranks'){clr('offices','rankId');W.grants=W.grants.filter(g=>g.rankId!==id)}
 if(kind==='offices'){const me=null;for(const o of W.offices)if(o.parentId===id)o.parentId=(I().offices.get(id)||{}).parentId||me;W.appts=W.appts.filter(a=>a.officeId!==id)}
 if(kind==='places'){clr('persons','birthPlaceId');clr('clans','seatId');clr('offices','placeId');clr('events','placeId');clr('places','parentId')}
 if(kind==='factions')clr('persons','factionId');
}
